apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-model-inference
  labels:
    app.kubernetes.io/name: world-model-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: world-model-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: world-model-inference
    spec:
      containers:
        - name: inference
          image: <inference-image>
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_MANIFEST
              value: /manifests/inference-service.json
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: manifests
              mountPath: /manifests
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: <model-cache-pvc>
        - name: manifests
          configMap:
            name: <manifest-configmap>
---
apiVersion: v1
kind: Service
metadata:
  name: world-model-inference
spec:
  selector:
    app.kubernetes.io/name: world-model-inference
  ports:
    - name: http
      port: 8000
      targetPort: 8000
