name: Validate blueprint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_repository.py
      - run: PYTHONPATH=src python -m world_model_blueprint.cli validate-repo --root .
      - run: PYTHONPATH=src python -m world_model_blueprint.cli format --check README.md docs skills benchmarks deploy schemas
      - run: PYTHONPATH=src python -m world_model_blueprint.cli skill-audit --root . --output artifacts/skill-audit.json
      - run: PYTHONPATH=src python benchmarks/run_benchmarks.py --output artifacts/benchmark-report.json
