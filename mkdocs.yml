site_name: World Model Blueprint
site_description: A governed enterprise blueprint for fine-tuning and deploying world models for sim-to-real autonomy.
site_url: https://hcltech-robotics.github.io/world-model-blueprint/
site_author: HCLTech Robotics
repo_url: https://github.com/hcltech-robotics/world-model-blueprint
repo_name: hcltech-robotics/world-model-blueprint
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: hcltech-robotics
  custom_dir: docs/overrides

extra:
  brand_title: World Model Blueprint
  social_preview_image: assets/images/world-model-blueprint-social-preview.jpg

markdown_extensions:
  - fenced_code
  - sane_lists
  - tables
  - toc:
      permalink: true

nav:
  - Index: index.md
  - Quickstart: quickstart.md
  - Blueprint:
      - Blueprint: blueprint.md
      - Reference architecture: reference-architecture.md
      - Data strategy: data-strategy.md
  - Operations:
      - Post-training: post-training.md
      - Infrastructure: infrastructure.md
      - Deployment: deployment.md
      - Toolchain: toolchain.md
  - Governance:
      - Agent system: agent-system.md
      - Governance: governance.md
      - Manifest contracts: manifest-contracts.md
      - Benchmarks: benchmarks.md
  - Reference:
      - Repository structure: repository-structure.md
      - Source map: source-map.md
