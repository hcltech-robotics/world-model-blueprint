<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">Data and SimReady factory</title>
  <desc id="desc">A schematic for turning operational evidence and business-critical assets into model-ready data.</desc>
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #0a100c; stroke: #3d4a42; stroke-width: 2; }
      .boxHot { fill: #0b1608; stroke: #76b900; stroke-width: 2.3; }
      .boxAccent { fill: #160929; stroke: #5f1ebe; stroke-width: 2.3; }
      .inner { fill: #0d130f; stroke: #7d8780; stroke-width: 1.9; }
      .innerHot { fill: #0d1809; stroke: #76b900; stroke-width: 1.9; }
      .innerAccent { fill: #1b0c31; stroke: #5f1ebe; stroke-width: 1.9; }
      .label { fill: #edf3ef; font-family: Aptos, Helvetica, sans-serif; font-size: 20px; font-weight: 680; }
      .small { fill: #c6cec8; font-family: Aptos, Helvetica, sans-serif; font-size: 13px; font-weight: 620; }
      .line { stroke: #e6ece8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .greenLine { stroke: #76b900; stroke-width: 2.4; fill: none; marker-end: url(#arrowGreen); }
      .accentLine { stroke: #5f1ebe; stroke-width: 2.4; fill: none; marker-end: url(#arrowAccent); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#e6ece8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#76b900"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#5f1ebe"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1360" height="620"/>
  <rect class="box" x="74" y="130" width="280" height="230" rx="8"/>
  <text class="label" x="214.0" y="173" text-anchor="middle">Real evidence</text>
  <rect class="inner" x="102" y="206" width="224" height="36" rx="4"/>
  <text class="small" x="214.0" y="228.5" text-anchor="middle" style="font-size:13px">video logs</text>
  <rect class="inner" x="102" y="254" width="224" height="36" rx="4"/>
  <text class="small" x="214.0" y="276.5" text-anchor="middle" style="font-size:13px">actions</text>
  <rect class="innerAccent" x="102" y="302" width="224" height="36" rx="4"/>
  <text class="small" x="214.0" y="324.5" text-anchor="middle" style="font-size:13px">telemetry</text>
  <path class="line" d="M354 245 L384 245"/>
  <rect class="box" x="388" y="130" width="280" height="230" rx="8"/>
  <text class="label" x="528.0" y="173" text-anchor="middle">Digital assets</text>
  <rect class="inner" x="416" y="202" width="224" height="26" rx="4"/>
  <text class="small" x="528.0" y="219.5" text-anchor="middle" style="font-size:13px">CAD</text>
  <rect class="inner" x="416" y="240" width="224" height="26" rx="4"/>
  <text class="small" x="528.0" y="257.5" text-anchor="middle" style="font-size:13px">OpenUSD</text>
  <rect class="innerHot" x="416" y="278" width="224" height="26" rx="4"/>
  <text class="small" x="528.0" y="295.5" text-anchor="middle" style="font-size:13px">NuRec/NRE</text>
  <rect class="innerHot" x="416" y="316" width="224" height="26" rx="4"/>
  <text class="small" x="528.0" y="333.5" text-anchor="middle" style="font-size:13px">SimReady</text>
  <path class="line" d="M668 245 L698 245"/>
  <rect class="boxAccent" x="702" y="130" width="280" height="230" rx="8"/>
  <text class="label" x="842.0" y="173" text-anchor="middle">Curate</text>
  <rect class="innerHot" x="730" y="206" width="224" height="36" rx="4"/>
  <text class="small" x="842.0" y="228.5" text-anchor="middle" style="font-size:13px">TAO</text>
  <rect class="innerHot" x="730" y="254" width="224" height="36" rx="4"/>
  <text class="small" x="842.0" y="276.5" text-anchor="middle" style="font-size:13px">VSS</text>
  <rect class="innerHot" x="730" y="302" width="224" height="36" rx="4"/>
  <text class="small" x="842.0" y="324.5" text-anchor="middle" style="font-size:13px">Cosmos Curator</text>
  <path class="line" d="M982 245 L1012 245"/>
  <rect class="box" x="1016" y="130" width="280" height="230" rx="8"/>
  <text class="label" x="1156.0" y="173" text-anchor="middle">Dataset</text>
  <rect class="innerAccent" x="1044" y="206" width="224" height="36" rx="4"/>
  <text class="small" x="1156.0" y="228.5" text-anchor="middle" style="font-size:13px">manifest</text>
  <rect class="inner" x="1044" y="254" width="224" height="36" rx="4"/>
  <text class="small" x="1156.0" y="276.5" text-anchor="middle" style="font-size:13px">holdouts</text>
  <rect class="inner" x="1044" y="302" width="224" height="36" rx="4"/>
  <text class="small" x="1156.0" y="324.5" text-anchor="middle" style="font-size:13px">stress slices</text>
  <rect class="boxAccent" x="552" y="424" width="580" height="108" rx="8"/>
  <text class="label" x="842.0" y="462" text-anchor="middle">Synthetic gap closure</text>
  <rect class="innerAccent" x="580" y="478" width="524" height="36" rx="4"/>
  <text class="small" x="842.0" y="500.0" text-anchor="middle" style="font-size:12px">scenario evidence</text>
  <path class="accentLine" d="M842 424 L842 360"/>
</svg>
