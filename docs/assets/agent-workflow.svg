<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent workflow</title>
  <desc id="desc">A schematic for LLM-backed agents that execute local skills, produce evidence, and pass review gates.</desc>
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #0a100c; stroke: #3d4a42; stroke-width: 2; }
      .boxHot { fill: #0b1608; stroke: #76b900; stroke-width: 2.3; }
      .inner { fill: #0d130f; stroke: #7d8780; stroke-width: 1.9; }
      .innerHot { fill: #0d1809; stroke: #76b900; stroke-width: 1.9; }
      .label { fill: #edf3ef; font-family: Aptos, Helvetica, sans-serif; font-size: 20px; font-weight: 680; }
      .small { fill: #c6cec8; font-family: Aptos, Helvetica, sans-serif; font-size: 13px; font-weight: 620; }
      .line { stroke: #e6ece8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .greenLine { stroke: #76b900; stroke-width: 2.4; fill: none; marker-end: url(#arrowGreen); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#e6ece8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#76b900"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1360" height="620"/>
  <rect class="box" x="70" y="90" width="260" height="176" rx="8"/>
  <text class="label" x="200.0" y="133" text-anchor="middle">User</text>
  <rect class="inner" x="98" y="163" width="204" height="36" rx="4"/>
  <text class="small" x="200.0" y="185.5" text-anchor="middle" style="font-size:13px">objective</text>
  <rect class="inner" x="98" y="211" width="204" height="36" rx="4"/>
  <text class="small" x="200.0" y="233.5" text-anchor="middle" style="font-size:13px">evidence path</text>
  <path class="line" d="M330 178 L386 178"/>
  <rect class="box" x="390" y="90" width="260" height="176" rx="8"/>
  <text class="label" x="520.0" y="133" text-anchor="middle">LLM runtime</text>
  <rect class="inner" x="418" y="163" width="204" height="36" rx="4"/>
  <text class="small" x="520.0" y="185.5" text-anchor="middle" style="font-size:13px">API key</text>
  <rect class="inner" x="418" y="211" width="204" height="36" rx="4"/>
  <text class="small" x="520.0" y="233.5" text-anchor="middle" style="font-size:13px">model id</text>
  <path class="greenLine" d="M650 178 L706 178"/>
  <rect class="box" x="710" y="90" width="260" height="176" rx="8"/>
  <text class="label" x="840.0" y="133" text-anchor="middle">Skill router</text>
  <rect class="inner" x="738" y="163" width="204" height="36" rx="4"/>
  <text class="small" x="840.0" y="185.5" text-anchor="middle" style="font-size:13px">SKILL.md</text>
  <rect class="inner" x="738" y="211" width="204" height="36" rx="4"/>
  <text class="small" x="840.0" y="233.0" text-anchor="middle" style="font-size:12px">output contract</text>
  <path class="line" d="M970 178 L1026 178"/>
  <rect class="box" x="1030" y="90" width="260" height="176" rx="8"/>
  <text class="label" x="1160.0" y="133" text-anchor="middle">Artefacts</text>
  <rect class="inner" x="1058" y="163" width="204" height="36" rx="4"/>
  <text class="small" x="1160.0" y="185.5" text-anchor="middle" style="font-size:13px">manifests</text>
  <rect class="inner" x="1058" y="211" width="204" height="36" rx="4"/>
  <text class="small" x="1160.0" y="233.5" text-anchor="middle" style="font-size:13px">review gates</text>
  <rect class="box" x="64" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="116.5" y="418" text-anchor="middle">intake</text>
  <path class="line" d="M169 417 L177 417"/>
  <rect class="box" x="181" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="233.5" y="418" text-anchor="middle">data</text>
  <path class="line" d="M286 417 L294 417"/>
  <rect class="box" x="298" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="350.5" y="418" text-anchor="middle">neural</text>
  <path class="line" d="M403 417 L411 417"/>
  <rect class="box" x="415" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="467.5" y="418" text-anchor="middle">simready</text>
  <path class="line" d="M520 417 L528 417"/>
  <rect class="box" x="532" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="584.5" y="418" text-anchor="middle">fine-tune</text>
  <path class="line" d="M637 417 L645 417"/>
  <rect class="box" x="649" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="701.5" y="418" text-anchor="middle">inference</text>
  <path class="line" d="M754 417 L762 417"/>
  <rect class="box" x="766" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="818.5" y="418" text-anchor="middle">eval</text>
  <path class="line" d="M871 417 L879 417"/>
  <rect class="box" x="883" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="935.5" y="418" text-anchor="middle">deploy</text>
  <path class="line" d="M988 417 L996 417"/>
  <rect class="box" x="1000" y="380" width="105" height="74" rx="8"/>
  <text class="label" x="1052.5" y="418" text-anchor="middle">govern</text>
  <path class="greenLine" d="M840 266 L840 334 L350 334 L350 380"/>
</svg>
