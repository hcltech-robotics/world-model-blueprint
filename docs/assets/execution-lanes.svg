<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">Execution lane selection</title>
  <desc id="desc">A schematic mapping workload classes to Brev, B200 Slurm, Megatron, OSMO, Kubernetes, Ray, NIM, and FlashDreams.</desc>
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #0a100c; stroke: #3d4a42; stroke-width: 2; }
      .boxHot { fill: #0b1608; stroke: #76b900; stroke-width: 2.3; }
      .boxAccent { fill: #160929; stroke: #5f1ebe; stroke-width: 2.3; }
      .inner { fill: #0d130f; stroke: #7d8780; stroke-width: 1.9; }
      .innerHot { fill: #0d1809; stroke: #76b900; stroke-width: 1.9; }
      .innerAccent { fill: #1b0c31; stroke: #5f1ebe; stroke-width: 1.9; }
      .label { fill: #edf3ef; font-family: Aptos, Helvetica, sans-serif; font-size: 20px; font-weight: 680; }
      .small { fill: #c6cec8; font-family: Aptos, Helvetica, sans-serif; font-size: 13px; font-weight: 620; }
      .line { stroke: #e6ece8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .greenLine { stroke: #76b900; stroke-width: 2.4; fill: none; marker-end: url(#arrowGreen); }
      .accentLine { stroke: #5f1ebe; stroke-width: 2.4; fill: none; marker-end: url(#arrowAccent); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#e6ece8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#76b900"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 4 L 0 7 z" fill="#5f1ebe"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1360" height="620"/>
  <rect class="boxAccent" x="76" y="214" width="250" height="172" rx="8"/>
  <text class="label" x="201.0" y="257" text-anchor="middle">Lane selector</text>
  <rect class="innerAccent" x="104" y="286" width="194" height="35" rx="4"/>
  <text class="small" x="201.0" y="307.5" text-anchor="middle" style="font-size:12px">evidence target</text>
  <rect class="inner" x="104" y="333" width="194" height="35" rx="4"/>
  <text class="small" x="201.0" y="355.0" text-anchor="middle" style="font-size:13px">cost envelope</text>
  <rect class="box" x="468" y="48" width="310" height="150" rx="8"/>
  <text class="label" x="623.0" y="91" text-anchor="middle">Pilot</text>
  <rect class="innerHot" x="496" y="120" width="254" height="26" rx="4"/>
  <text class="small" x="623.0" y="137.5" text-anchor="middle" style="font-size:13px">Brev</text>
  <rect class="innerHot" x="496" y="154" width="254" height="26" rx="4"/>
  <text class="small" x="623.0" y="171.5" text-anchor="middle" style="font-size:13px">Launchable</text>
  <path class="line" d="M326 300 L394 300 L394 123 L468 123"/>
  <rect class="boxAccent" x="468" y="232" width="310" height="150" rx="8"/>
  <text class="label" x="623.0" y="275" text-anchor="middle">Large training</text>
  <rect class="innerHot" x="496" y="304" width="254" height="26" rx="4"/>
  <text class="small" x="623.0" y="321.5" text-anchor="middle" style="font-size:13px">B200 Slurm</text>
  <rect class="inner" x="496" y="338" width="254" height="26" rx="4"/>
  <text class="small" x="623.0" y="355.5" text-anchor="middle" style="font-size:13px">Pyxis/Enroot</text>
  <path class="accentLine" d="M326 300 L394 300 L394 307 L468 307"/>
  <rect class="box" x="468" y="416" width="310" height="150" rx="8"/>
  <text class="label" x="623.0" y="459" text-anchor="middle">Massive scale</text>
  <rect class="innerHot" x="496" y="488" width="254" height="26" rx="4"/>
  <text class="small" x="623.0" y="505.5" text-anchor="middle" style="font-size:13px">Megatron-Core</text>
  <rect class="inner" x="496" y="522" width="254" height="26" rx="4"/>
  <text class="small" x="623.0" y="539.5" text-anchor="middle" style="font-size:13px">Bridge</text>
  <path class="line" d="M326 300 L394 300 L394 491 L468 491"/>
  <rect class="boxAccent" x="904" y="134" width="310" height="150" rx="8"/>
  <text class="label" x="1059.0" y="177" text-anchor="middle">Orchestrate</text>
  <rect class="innerHot" x="932" y="206" width="254" height="26" rx="4"/>
  <text class="small" x="1059.0" y="223.5" text-anchor="middle" style="font-size:13px">OSMO</text>
  <rect class="inner" x="932" y="240" width="254" height="26" rx="4"/>
  <text class="small" x="1059.0" y="257.5" text-anchor="middle" style="font-size:13px">Kubernetes/Ray</text>
  <rect class="box" x="904" y="326" width="310" height="178" rx="8"/>
  <text class="label" x="1059.0" y="369" text-anchor="middle">Serve</text>
  <rect class="innerHot" x="932" y="398" width="254" height="21" rx="4"/>
  <text class="small" x="1059.0" y="413.0" text-anchor="middle" style="font-size:13px">NIM</text>
  <rect class="innerHot" x="932" y="431" width="254" height="21" rx="4"/>
  <text class="small" x="1059.0" y="446.0" text-anchor="middle" style="font-size:13px">FlashDreams</text>
  <rect class="innerHot" x="932" y="464" width="254" height="21" rx="4"/>
  <text class="small" x="1059.0" y="479.0" text-anchor="middle" style="font-size:13px">Dynamo</text>
  <path class="accentLine" d="M778 307 L842 307 L842 209 L904 209"/>
  <path class="line" d="M778 491 L842 491 L842 415 L904 415"/>
</svg>
