<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">World model blueprint architecture</title>
  <desc id="desc">A five-block architecture from scoped evidence to data assets, Cosmos adaptation, inference, and sim-to-real operations.</desc>
  <defs>
    <style>
      .bg { fill: transparent; }
