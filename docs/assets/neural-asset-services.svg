<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">Neural asset services</title>
  <desc id="desc">A schematic for routing source evidence to NVIDIA skills, Content Agents, NuRec, and SimReady or dataset handoff.</desc>
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #0a100c; stroke: #3d4a42; stroke-width: 2; }
