[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-model-blueprint"
version = "0.1.0"
description = "Operational tooling for the world model blueprint for autonomy programmes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chris von Csefalvay", email = "kristof.csefalvay@hcltech.com" },
]

[project.optional-dependencies]
docs = [
    "mkdocs-hcltech-robotics @ git+https://github.com/hcltech-robotics/mkdocs-hcltech-robotics.git@83f8ad2070011f787eb0e0335f9a8824facc8ff0",
]

[project.scripts]
wmb = "world_model_blueprint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/world_model_blueprint"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.world-model-blueprint]
schema_dir = "schemas"
skill_dir = "skills"
benchmark_dir = "benchmarks"
